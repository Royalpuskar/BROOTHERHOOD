name: Publish Brootherhood website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify learning simulations
        run: npm test
      - name: Prepare static website
        run: |
          mkdir -p dist/src dist/assets dist/legacy dist/studio dist/horizon dist/experience dist/pocket-3d-lab dist/syllabus
          cp index.html digital.css academy.css float-motion.css universe-v2.css atlas.css launch.css styles.css styles-guide.css sw.js dist/
          cp src/app.js src/logic.js src/discovery.js src/discovery-ui.js src/guide-scene.js dist/src/
          cp src/informatics-core.js src/digital-app.js src/digital-scene.js src/universe-v2.js src/world-fidelity.js src/atlas.js src/launch.js src/code-worker.js dist/src/
          cp src/academy-content.js src/academy-app.js src/float-motion.js src/academy-python-worker.js src/academy-sql-worker.js src/academy-typescript-worker.js dist/src/
          cp legacy/index.html dist/legacy/
          cp studio/index.html studio/studio.css studio/studio.js studio/core.js dist/studio/
          cp horizon/index.html horizon/portal.css horizon/portal.js dist/horizon/
          cp experience/index.html experience/experience.css experience/experience.js dist/experience/
          cp pocket-3d-lab/index.html pocket-3d-lab/styles.css pocket-3d-lab/app.js pocket-3d-lab/content.js pocket-3d-lab/heart-3d.js pocket-3d-lab/favicon.svg dist/pocket-3d-lab/
          cp syllabus/index.html syllabus/study.css syllabus/app.js syllabus/content.js syllabus/math-core.js dist/syllabus/
          cp assets/favicon.svg assets/brand-mark.svg assets/launch-diorama.svg dist/assets/
          touch dist/.nojekyll
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for GitHub artifact metadata indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            count="$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '[.artifacts[] | select(.name == "github-pages")] | length')"
            echo "Pages artifacts indexed: $count (check $attempt)"
            if [ "$count" = "1" ]; then
              echo "Pages archive is discoverable; proceeding with deployment"
              exit 0
            fi
            sleep 4
          done
          echo "GitHub did not index exactly one github-pages artifact"
          exit 1
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

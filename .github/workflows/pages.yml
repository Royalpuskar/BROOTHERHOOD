name: Publish Brootherhood website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify learning simulations
        run: npm test
      - name: Prepare static website
        run: |
          mkdir -p dist/src dist/assets dist/legacy
          cp index.html digital.css academy.css float-motion.css styles.css styles-guide.css sw.js dist/
          cp src/app.js src/logic.js src/discovery.js src/discovery-ui.js src/guide-scene.js dist/src/
          cp src/informatics-core.js src/digital-app.js src/digital-scene.js src/code-worker.js dist/src/
          cp src/academy-content.js src/academy-app.js src/float-motion.js src/academy-python-worker.js src/academy-sql-worker.js src/academy-typescript-worker.js dist/src/
          cp legacy/index.html dist/legacy/
          cp assets/favicon.svg dist/assets/
          touch dist/.nojekyll
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

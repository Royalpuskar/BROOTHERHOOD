name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm test

  horizon-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Horizon dependencies
        run: python -m pip install -r horizon/backend/requirements.txt
      - name: Check Python syntax and backend functionality
        run: |
          python -m compileall -q horizon/backend/app.py horizon/backend/test_app.py
          cd horizon/backend
          python -m pytest -q test_app.py
        env:
          APP_ENV: test
          SEED_DEMO: '1'
          APP_SECRET: test-secret-for-integrated-horizon-event-testing-012345
